version: 2

updates:
  # Enable version updates for uv
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    versioning-strategy: increase-if-necessary

    open-pull-requests-limit: 5

    commit-message:
      prefix: "Dependabot"

  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    versioning-strategy: increase-if-necessary

    open-pull-requests-limit: 5

    commit-message:
      prefix: "Dependabot"
