name: CI/CD
on: [push, pull_request]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c #v7
      with:
        enable-cache: true

    - name: Install dependencies
      working-directory: backend
      run: |
        uv sync --only-group lint

    - name: Lint with flake8
      working-directory: backend
      run: |
        uv run --no-sync flake8 .

    - name: Check formatting with Black
      working-directory: backend
      run: |
        uv run --no-sync black --check --line-length 90 .

  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c #v7
      with:
        enable-cache: true

    - name: Install dependencies
      working-directory: backend
      run: |
        uv sync --extra cpu --group test

    - name: Run tests with coverage
      working-directory: backend
      run: |
        uv run pytest --cov=. --cov-report=xml --cov-report=term-missing -n auto

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@f30e4959ba63075080d4f7f90cacc18d9f3fafd7 #v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: backend/coverage.xml
        flags: backend

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: frontend
      run: |
        npm ci

    - name: Run ESLint
      working-directory: frontend
      run: |
        npx eslint .

    - name: Check Prettier formatting
      working-directory: frontend
      run: |
        npx prettier --check "src/**/*.{ts,tsx}"

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: frontend
      run: |
        npm ci

    - name: Run tests with coverage
      working-directory: frontend
      run: |
        npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@f30e4959ba63075080d4f7f90cacc18d9f3fafd7 #v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: frontend/coverage/lcov.info
        flags: frontend
