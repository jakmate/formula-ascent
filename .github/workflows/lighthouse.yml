name: Lighthouse badge

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Run lighthouse-badges in docker
        run: |
          mkdir -p badges
          chmod 0777 badges

          container_id=$(docker create \
            -u 0:0 \
            emazzotta/lighthouse-badges \
            /bin/sh -c "lighthouse-badges \
              --url https://formula-ascent.onrender.com/predictions \
              --url https://formula-ascent.onrender.com/schedule \
              --single-badge \
              --output-path /home/chrome/reports \
              --badge-style flat \
              --save-report")

          docker start -a "$container_id"
          docker cp "$container_id:/home/chrome/reports/lighthouse.svg" badges/lighthouse-badge.svg
          docker rm "$container_id"

          ls -la badges

      - name: Commit and push badge if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet badges/lighthouse-badge.svg; then
            echo "No SVG changes to commit"
          else
            git add badges/lighthouse-badge.svg
            git commit -m "chore(ci): update Lighthouse badge"
            git push origin HEAD:${{ github.ref_name }}
          fi
