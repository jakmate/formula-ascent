name: Lighthouse badge (docker image)

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Run lighthouse-badges in docker
        run: |
          mkdir -p badges
          chmod 0777 badges

          docker run --rm \
            -u 0:0 \
            -v "$PWD/badges":/home/chrome/reports:rw \
            emazzotta/lighthouse-badges \
            /bin/sh -c "lighthouse-badges \
              --url https://formula-ascent.onrender.com/predictions \
              --url https://formula-ascent.onrender.com/schedule \
              --single-badge \
              --output-path /home/chrome/reports \
              --badge-style flat-square \
              --save-report"

          echo "Produced files:"
          ls -la badges || true

          generated_svg=$(ls badges/*.svg 2>/dev/null | head -n 1 || true)
          if [ -n "$generated_svg" ]; then
            mv -f "$generated_svg" badges/lighthouse-badge.svg
          else
            echo "No badge generated!"
            exit 1
          fi

      - name: Commit and push badge if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/lighthouse-badge.svg || true
          if git diff --staged --quiet -- badges/lighthouse-badge.svg; then
            echo "No SVG changes to commit"
          else
            git commit -m "chore(ci): update Lighthouse badge"
            git push origin HEAD:${{ github.ref_name }}
          fi
