[project]
name = "formula-ascent-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.1",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.124.4",
    "geopy>=2.4.1",
    "imbalanced-learn>=0.14.0",
    "joblib>=1.5.2",
    "lightgbm>=4.6.0",
    "lxml>=6.0.2",
    "markupsafe<3.0.2",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "requests>=2.28.1",
    "scikit-learn<1.8.0",
    "timezonefinder>=8.1.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[dependency-groups]
dev = [
  {include-group = "lint"}, 
  {include-group = "test"}
]
lint = [
    "black>=25.12.0",
    "flake8>=7.3.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools]
packages = ["app"]
