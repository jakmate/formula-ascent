[project]
name = "formula-ascent-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "apscheduler>=3.11.1",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.124.4",
    "geopy>=2.4.1",
    "imbalanced-learn>=0.14.1",
    "joblib>=1.5.2",
    "lightgbm>=4.6.0",
    "lxml>=6.1.0",
    "markupsafe<3.0.4",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "requests>=2.28.1",
    "scikit-learn<1.8.0",
    "timezonefinder>=8.1.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0"
]
cu128 = [
  "torch>=2.11.0"
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"}
]
lint = [
    "ruff>=0.14.13"
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D100", "D101", "D102", "D103", "D104", "D107", "D401",
  "PLC0415",
  "PLR2004", "PLR0913", "PLR0915", "PLR0912",
  "S101",
  "ANN001", "ANN202", "ANN201",
  "TRY003", "TRY300",
  "SLF001",
  "PT011", "PT012",
  "ARG002",
  "PTH110", "PTH103", "PTH122", "PTH118", "PTH123", "PTH208", "PTH119", "PTH207", "PTH104",
  "E501",
  "PERF401",
  "RUF001",
  "FBT002", "FBT003",
  "EM102", "EM101",
  "BLE001",
  "DTZ001", "DTZ005", "DTZ007",
  "T201",
  "C901",
  "PLW0603",
  "B008", "B904",
  "NPY002"
]

[tool.setuptools]
packages = ["app"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
